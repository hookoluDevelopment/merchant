<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Recovery - Claystone Projects</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h2>Forgot Password</h2>

    <!-- Step 1: Verification Form -->
    <form id="verifyForm">
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" required>
        </div>
        <div class="form-group">
            <label>Date of Registration</label>
            <input type="date" id="dateOfRegistration" required>
        </div>
        <div class="form-group">
            <label>Age During Registration</label>
            <input type="number" id="ageDuringRegistration" required>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="phoneNumber" required>
        </div>
        <div class="form-group">
            <label>Email ID</label>
            <input type="email" id="email" required>
        </div>
        <button type="submit" class="btn">Verify Account</button>
    </form>

    <!-- Step 2: Reset Form -->
    <form id="resetForm" style="display: none;">
        <h3>Reset Password</h3>
        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" minlength="8" maxlength="16" required>
        </div>
        <button type="submit" class="btn">Set New Password</button>
    </form>

    <div id="errorMsg" style="color: red; margin-top: 15px; text-align: center; display: none;"></div>
</div>

<script>
    let verifiedUsername = "";

    document.getElementById('verifyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            username: document.getElementById('username').value,
            dateOfRegistration: document.getElementById('dateOfRegistration').value,
            ageDuringRegistration: document.getElementById('ageDuringRegistration').value,
            phoneNumber: document.getElementById('phoneNumber').value,
            email: document.getElementById('email').value
        };

        const res = await fetch('/api/auth/forgot-password/verify', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if (res.ok) {
            const result = await res.json();
            verifiedUsername = result.username;
            document.getElementById('verifyForm').style.display = 'none';
            document.getElementById('resetForm').style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        } else {
            document.getElementById('errorMsg').innerText = "Some or all info provided are wrong.";
            document.getElementById('errorMsg').style.display = 'block';
        }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('newPassword').value;

        const res = await fetch('/api/auth/forgot-password/reset', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ username: verifiedUsername, newPassword: newPassword })
        });

        if (res.ok) {
            alert('Password reset successfully. Routing to login page...');
            window.location.href = 'login.html';
        } else {
            alert('Failed to reset password.');
        }
    });
</script>
</body>
</html>
