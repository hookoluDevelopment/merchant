<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Login - Claystone Projects</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h2>Merchant Sign In</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your provided username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-group">
            <label for="totpCode">TOTP Authenticator Code</label>
            <input type="text" id="totpCode" placeholder="6-digit code from Authenticator app" maxlength="6" pattern="[0-9]{6}" required>
        </div>

        <button type="submit" class="btn">Login</button>
    </form>

    <div class="links">
        <p><a href="/forgot-password.html">Forgot Password?</a></p>
        <p>Don't have an account? <a href="/signup.html">Sign Up</a></p>
    </div>

    <div id="loginError" class="alert-box" style="display: none; background-color: #f8d7da; border-color: #f5c6cb; color: #721c24;">
        <p id="errorText">Invalid credentials or TOTP code.</p>
    </div>
</div>

<!-- Client-side script -->
<script src="/js/login.js"></script>
</body>
</html>
