<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merchant Sign Up - Claystone Projects</title>
    <!-- Relative link to static CSS -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h2>Merchant Registration</h2>
    <form id="signUpForm">
        <div class="form-group">
            <label for="nameAsPerAadhaar">Name as per Identity Document</label>
            <input type="text" id="nameAsPerAadhaar" required>
        </div>
        <div class="form-group">
            <label for="panCardNo">PAN Card No</label>
            <input type="text" id="panCardNo" required>
        </div>
        <div class="form-group">
            <label for="aadhaarNo">ID Document Number</label>
            <input type="text" id="aadhaarNo" placeholder="Enter ID Number" required>
        </div>
        <div class="form-group">
            <label for="mobileNo">Mobile No</label>
            <input type="text" id="mobileNo" required>
        </div>
        <div class="form-group">
            <label for="email">Email ID</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label for="bankAccountNo">Bank Account No</label>
            <input type="text" id="bankAccountNo" required>
        </div>
        <div class="form-group">
            <label for="ifscCode">IFSC Code</label>
            <input type="text" id="ifscCode" required>
        </div>
        <div class="form-group">
            <label for="presentAddress">Present Address</label>
            <input type="text" id="presentAddress" required>
        </div>
        <div class="form-group">
            <label for="permanentAddress">Permanent Address</label>
            <input type="text" id="permanentAddress" required>
        </div>
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" min="18" required>
        </div>
        <div class="form-group">
            <label for="password">Set Password (8-16 chars, letters & numbers)</label>
            <input type="password" id="password" minlength="8" maxlength="16" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" minlength="8" maxlength="16" required>
        </div>

        <button type="submit" class="btn">Register & Setup TOTP</button>
    </form>

    <div id="registrationSuccess" class="alert-box" style="display:none;">
        <h3>Registration Successful!</h3>
        <p><strong>Username Provided:</strong> <span id="outUsername"></span></p>
        <p style="color: red; font-weight: bold;">Important: Save this information for account recovery!</p>
        <ul>
            <li><strong>Date of Registration:</strong> <span id="outRegDate"></span></li>
            <li><strong>Age during Registration:</strong> <span id="outAge"></span></li>
            <li><strong>Phone Number:</strong> <span id="outPhone"></span></li>
            <li><strong>Email ID:</strong> <span id="outEmail"></span></li>
        </ul>
        <div style="text-align:center;">
            <p>Scan this QR Code in Authenticator App:</p>
            <img id="qrCodeImg" src="" alt="TOTP QR Code">
        </div>
        <button class="btn btn-secondary" onclick="window.location.href='/login.html'">Proceed to Login</button>
    </div>
</div>

<!-- Relative link to static JS -->
<script src="/js/signup.js"></script>
</body>
</html>
